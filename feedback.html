<style>

        /* Star Rating Logic */
        .star-rating input[type="radio"] {
            display: none;
        }
        .star-rating label {
            cursor: pointer;
            color: theme('colors.outline-variant');
            transition: color 0.2s ease, transform 0.1s ease;
        }
        .star-rating label:active {
            transform: scale(0.9);
        }
        .star-rating label.active,
        .star-rating label.active ~ label {
            /* We use JS to handle visual state to allow 'filled' icon toggle */
        }
    </style>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Star Rating Logic
            const starContainer = document.getElementById('star-container');
            const totalStars = 5;
            let currentRating = 0;

            for (let i = 1; i <= totalStars; i++) {
                const starLabel = document.createElement('label');
                starLabel.setAttribute('for', `star${i}`);
                starLabel.className = 'w-12 h-12 flex items-center justify-center text-outline-variant transition-colors cursor-pointer active:scale-90';
                
                const starIcon = document.createElement('span');
                starIcon.className = 'material-symbols-outlined text-[40px]';
                starIcon.setAttribute('data-icon', 'star');
                starIcon.style.fontVariationSettings = "'FILL' 0";
                starIcon.textContent = 'star';
                
                starLabel.appendChild(starIcon);

                starLabel.addEventListener('click', () => {
                    currentRating = i;
                    updateStars();
                });

                starContainer.appendChild(starLabel);
            }

            function updateStars() {
                const labels = starContainer.querySelectorAll('label');
                labels.forEach((label, index) => {
                    const icon = label.querySelector('span');
                    if (index < currentRating) {
                        label.classList.remove('text-outline-variant');
                        label.classList.add('text-primary');
                        icon.style.fontVariationSettings = "'FILL' 1";
                    } else {
                        label.classList.remove('text-primary');
                        label.classList.add('text-outline-variant');
                        icon.style.fontVariationSettings = "'FILL' 0";
                    }
                });
            }

            // Chip Selection Logic
            const chips = document.querySelectorAll('.feedback-chip');
            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    chip.classList.toggle('bg-primary-container');
                    chip.classList.toggle('text-on-primary-container');
                    chip.classList.toggle('border-primary-container');
                    chip.classList.toggle('border-outline-variant');
                });
            });
        });
    </script>

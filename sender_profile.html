<div class="flex justify-between items-center">
<div>

</div>
</div>
<div class="flex justify-between items-center">
<div>

<p class="font-body-md text-body-md text-outline italic">Not added</p>
</div>
<button class="font-label-md text-label-md text-primary font-bold flex items-center gap-1">
                            Add Email <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</div>
</div>
</section>

<span class="material-symbols-outlined text-[18px]">check_circle</span> Active
                        </p>
</div>

</div>

</button>
</li>
<li class="">

</button>

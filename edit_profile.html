<body class="bg-background text-on-background min-h-screen font-body-md antialiased overflow-x-hidden flex justify-center">
<div class="w-full max-w-[390px] min-h-[884px] bg-background relative flex flex-col shadow-2xl">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim shadow-sm flex items-center justify-between px-margin-mobile h-16 w-full z-10">
<a class="w-10 h-10 flex items-center justify-center hover:bg-primary-container/10 dark:hover:bg-primary-container/20 rounded-full transition-colors active:scale-95 transition-transform duration-150 text-on-surface-variant dark:text-on-surface-variant cursor-pointer" href="{{DATA:SCREEN:SCREEN_2}}">

</a>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim absolute left-1/2 transform -translate-x-1/2">Edit Profile</h1>
<div class="w-10 h-10 flex items-center justify-center hover:bg-primary-container/10 dark:hover:bg-primary-container/20 rounded-full transition-colors active:scale-95 transition-transform duration-150 text-on-surface-variant dark:text-on-surface-variant invisible">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow p-margin-mobile flex flex-col gap-lg">
<!-- Profile Photo Section -->
<section class="flex flex-col items-center justify-center mt-md">
<div class="relative group cursor-pointer mb-sm">
<img class="w-24 h-24 rounded-full object-cover shadow-sm border border-surface-variant" data-alt="A highly detailed close-up portrait of a young professional man named Alex Sharma. He has a clean haircut, warm skin tone, and is wearing a modern casual indigo polo shirt. The lighting is soft studio lighting with a clean light gray background, highlighting his approachable and confident expression. Corporate modern style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCjgYNbVyT5NdK4LP_aVg-JenxN-UXAN0tkGp2FzhreqrXLUvCIdsvclLJGnne7_fLC8hVKCComPWmxiT1T3aYobjlxcjDt_qWBPf5WSZM03iuj-9soj2w23XruhIRRxFCeBWoPUa_8jSsal2TFzO6_YhGMxMmRm1B3sPoCsG6OzD3wkAH4gGSmvVYloGwNHD99Zs0OHb2RtIi49KNlutyc-kI5YhQXjK_vyCURBIMUILnMDTLWMAwrYQ">
<div class="absolute bottom-0 right-0 bg-primary text-on-primary rounded-full p-1 shadow-md">
<span class="material-symbols-outlined text-[16px]" data-icon="camera_alt">camera_alt</span>
</div>
</div>
<button class="text-primary font-label-md text-label-md bg-transparent border-none outline-none">Change Photo</button>
</section>
<!-- Personal Information Form Card -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-surface-variant p-md flex flex-col gap-md">
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="fullName">Full Name</label>
<input class="w-full bg-surface text-on-surface font-body-lg text-body-lg rounded-lg border border-outline-variant px-sm py-sm focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none" id="fullName" placeholder="Enter your full name" type="text" value="Alex Sharma">
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="phoneNumber">Phone Number</label>
<input class="w-full bg-surface text-on-surface font-body-lg text-body-lg rounded-lg border border-outline-variant px-sm py-sm focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none" id="phoneNumber" placeholder="Enter your phone number" type="tel" value="+91 XXXXX XXXXX">
</div>
<!-- Email Address (Optional) -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="emailAddress">Email Address <span class="text-outline font-normal">(Optional)</span></label>
<input class="w-full bg-surface text-on-surface font-body-lg text-body-lg rounded-lg border border-outline-variant px-sm py-sm focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none placeholder:text-outline" id="emailAddress" placeholder="Not added" type="email" value="">
<p class="font-body-md text-body-md text-outline text-[12px] mt-xs">Email is optional and can be added later.</p>
</div>
</section>
</main>
<!-- Fixed Bottom Save Action -->
<div class="p-margin-mobile pb-lg bg-background w-full">
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-sm px-lg rounded-lg shadow-sm active:scale-95 transition-transform duration-150 h-12 flex items-center justify-center">
                Save Changes
            </button>

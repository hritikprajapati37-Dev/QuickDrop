<style>
        /* Base styles */
        body {
            font-family: 'Public Sans', sans-serif;
            background-color: #eff4ff; /* surface-container-low */
            color: #0b1c30; /* on-surface */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile Container Simulation */
        #mobile-container {
            width: 390px;
            height: 884px;
            background-color: #eff4ff; /* surface-container-low */
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border-radius: 40px; /* To look like a phone */
            border: 8px solid #213145; /* inverse-surface for phone bezel */
        }
        
        /* Material Symbols Outline Base */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Hide scrollbar for cleaner look */
        #mobile-container::-webkit-scrollbar {
            display: none;
        }
        #mobile-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface-dim">
<div id="mobile-container">
<!-- TopAppBar -->
<header class="flex items-center justify-between px-margin-mobile w-full h-16 bg-surface z-10 sticky top-0">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container active:scale-95 transition-transform">
<!-- Using empty div to balance flex space if no icon is needed for a true "success" screen, but keeping structure as per json guidance -->
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary flex-1 text-center">QuickDrop</h1>
<div class="w-12 h-12"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content (Centered Vertically) -->
<main class="flex-1 flex flex-col justify-center px-margin-mobile py-lg relative">
<!-- Confetti/Celebration background effect (Subtle) -->
<div class="absolute inset-0 pointer-events-none overflow-hidden opacity-50 flex items-center justify-center">
<div class="w-64 h-64 bg-primary-fixed rounded-full blur-3xl opacity-30"></div>
<div class="w-48 h-48 bg-secondary-fixed rounded-full blur-2xl opacity-20 absolute top-1/4 -right-10"></div>
</div>
<div class="flex flex-col items-center text-center z-10 relative">
<!-- Success Icon -->
<div class="w-24 h-24 bg-surface-container rounded-full flex items-center justify-center mb-lg shadow-sm border border-outline-variant/30 relative">
<!-- Inner pulse effect -->
<div class="absolute inset-0 bg-primary-container/20 rounded-full animate-ping opacity-50 duration-1000"></div>
<span class="material-symbols-outlined text-[64px] text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Typography -->
<h2 class="font-display-lg text-display-lg text-on-surface mb-sm">Thank You!</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mb-xl">Your feedback has been submitted successfully.</p>
<!-- Feedback Summary Card (Level 1 Elevation) -->
<div class="w-full bg-surface-container-lowest rounded-xl p-md shadow-sm border border-outline-variant/40 flex flex-col gap-sm mb-xl text-left">
<h3 class="font-title-lg text-title-lg text-on-surface pb-xs border-b border-outline-variant/20 mb-xs">Feedback Submitted</h3>
<div class="flex justify-between items-center py-xs">
<span class="font-body-md text-body-md text-on-surface-variant">Order</span>
<span class="font-body-md text-body-md text-on-surface font-semibold">#QD-9284</span>
</div>
<div class="flex justify-between items-center py-xs">
<span class="font-body-md text-body-md text-on-surface-variant">Delivery Partner</span>
<span class="font-body-md text-body-md text-on-surface">Rahul Sharma</span>
</div>
<div class="flex justify-between items-center py-xs">
<span class="font-body-md text-body-md text-on-surface-variant">Rating</span>
<div class="flex gap-1 text-primary">
<span class="material-symbols-outlined text-[20px]" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[20px]" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[20px]" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[20px]" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[20px]" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-sm mt-auto w-full">
<button class="w-full h-[48px] bg-primary text-on-primary rounded-xl font-body-lg text-body-lg font-semibold shadow-sm active:scale-95 transition-transform flex items-center justify-center">
                        Back to Order
                    </button>
<button class="w-full h-[48px] bg-transparent text-primary rounded-xl font-body-lg text-body-lg font-semibold active:bg-surface-container transition-colors flex items-center justify-center">
                        Go to Order History
                    </button>
</div>
</div>
</main>
<!-- Bottom Nav Bar omitted as per instructions (Success/Transactional screen) -->
</div>
